<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | TaxWizards</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root{--ivory:#fbf8f5;--navy:#0b2a4a;--navy-2:#173d68;--night:#08182b;--ink:#0a1a33;--muted:#52627a;--blue:#1857ff;--line:#e6dfd6;--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--ivory);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
  a{color:inherit;text-decoration:none}
  .brand{display:inline-flex;align-items:center;gap:10px;margin:0 auto}
  .brand img{height:38px;width:auto;display:block}
  main{flex:1;display:grid;place-items:center;width:100%;max-width:640px;margin:0 auto;text-align:center;padding:40px 0}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .eyebrow b{color:var(--blue);font-size:15px;letter-spacing:.08em}
  h1{font-size:clamp(32px,6vw,54px);line-height:1.05;letter-spacing:-.025em;font-weight:800;margin:18px 0 0;text-wrap:balance}
  p{margin:16px auto 0;max-width:46ch;color:var(--muted);font-size:clamp(16px,1.8vw,18px)}
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px}
  .btn{display:inline-flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:999px;padding:15px 26px;font-weight:700;box-shadow:0 10px 24px -10px rgba(11,42,74,.6);transition:transform .2s,background .2s}
  .btn:hover{transform:translateY(-2px);background:var(--navy-2)}
  .ghost{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:14px 22px;font-weight:600;color:var(--navy);background:#fff}
  .ghost:hover{border-color:#cfc5b8}
  footer{text-align:center;color:var(--muted);font-size:14px;padding-top:20px;border-top:1px solid var(--line);max-width:640px;margin:0 auto;width:100%}
  footer a{color:var(--navy);font-weight:600}
  :focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
</style>
</head>
<body>
  <a class="brand" href="/" aria-label="TaxWizards home"><img src="/assets/brand-logo-nav.png" alt="TaxWizards"></a>
  <main>
    <div>
      <p class="eyebrow"><b>404</b> Page not found</p>
      <h1>This page has moved out.</h1>
      <p>The page you were looking for isn’t here. Everything you need is on the homepage — or call us and we’ll point you the right way.</p>
      <div class="actions">
        <a class="btn" href="/">Back to homepage</a>
        <a class="ghost" href="tel:+918460622620">+91 84606 22620</a>
        <a class="ghost" href="mailto:info@taxwizards.in">info@taxwizards.in</a>
      </div>
    </div>
  </main>
  <footer><a href="/privacy.html">Privacy</a> &nbsp;·&nbsp; TaxWizards</footer>
</body>
</html>
